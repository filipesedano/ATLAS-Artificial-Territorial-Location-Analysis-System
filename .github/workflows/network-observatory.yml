name: Network Observatory checks
on:
  pull_request:
    paths:
      - 'network-observatory/**'
      - '.github/workflows/network-observatory.yml'
  push:
    branches: ['feature/atlas-agent-policy-preview']
    paths:
      - 'network-observatory/**'
      - '.github/workflows/network-observatory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observatory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Run contract, collector, API and startup tests
        working-directory: network-observatory
        run: npm test
